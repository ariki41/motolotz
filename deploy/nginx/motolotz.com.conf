# Included from the Nginx http context (for example, sites-enabled).
# Trust CF-Connecting-IP only when the TCP peer is in a Cloudflare IP range.
# Keep this list in sync with https://www.cloudflare.com/ips/.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Classify User-Agent data before logs reach Loki. Keep these values coarse so
# dashboards can aggregate them without introducing high-cardinality labels.
map $http_user_agent $motolotz_bot {
    default                                                      false;
    ~*(bot|crawler|spider|slurp|bingpreview|facebookexternalhit) true;
}

map $http_user_agent $motolotz_device {
    default                                                      Desktop;
    ~*(bot|crawler|spider|slurp|bingpreview|facebookexternalhit) Bot;
    ~*(ipad|tablet|kindle|silk|playbook)                         Tablet;
    ~*(mobile|iphone|ipod|android.*mobile)                       Mobile;
    ~*android                                                    Tablet;
}

map $http_user_agent $motolotz_os {
    default                        Other;
    ~*(bot|crawler|spider|slurp|bingpreview|facebookexternalhit) Bot;
    ~*(iphone|ipad|ipod)           iOS;
    ~*android                      Android;
    ~*windows                      Windows;
    ~*(macintosh|mac\ os\ x)       macOS;
    ~*cros                         ChromeOS;
    ~*linux                        Linux;
}

map $http_user_agent $motolotz_browser {
    default                                                      Other;
    ~*(bot|crawler|spider|slurp|bingpreview|facebookexternalhit) Bot;
    ~*(edg|edge|edga|edgios)/                                    Edge;
    ~*(opr|opera)/                                               Opera;
    ~*(chrome|crios)/                                            Chrome;
    ~*(firefox|fxios)/                                           Firefox;
    ~*(msie|trident)/                                            InternetExplorer;
    ~*safari/                                                    Safari;
    ~*(curl|wget)/                                               CLI;
}

# Keep request paths free of query strings, which may contain credentials.
log_format ltsv 'time:$time_iso8601\t'
                'client_ip:$remote_addr\t'
                'cloudflare_addr:$realip_remote_addr\t'
                'cloudflare_port:$realip_remote_port\t'
                'country:$http_cf_ipcountry\t'
                'request_method:$request_method\t'
                'request_uri:$uri\t'
                'server_protocol:$server_protocol\t'
                'status:$status\t'
                'body_bytes_sent:$body_bytes_sent\t'
                'referer:$http_referer\t'
                'forwardedfor:$http_x_forwarded_for\t'
                'request_time:$request_time\t'
                'useragent:$http_user_agent';

# Dedicated structured log for Loki. The legacy access.log above is retained
# for host-level tooling and backwards compatibility.
log_format motolotz_json escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$realip_remote_addr",'
        '"client_ip":"$remote_addr",'
        '"country":"$http_cf_ipcountry",'
        '"method":"$request_method",'
        '"host":"$host",'
        '"uri":"$uri",'
        '"request_uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"referer":"$http_referer",'
        '"device":"$motolotz_device",'
        '"os":"$motolotz_os",'
        '"browser":"$motolotz_browser",'
        '"bot":$motolotz_bot,'
        '"user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';

server {
    listen 80;
    listen [::]:80;
    server_name motolotz.com www.motolotz.com;
    access_log /var/log/nginx/access.log ltsv;
    access_log /var/log/nginx/motolotz_access.json.log motolotz_json;
    return 301 https://motolotz.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.motolotz.com;
    access_log /var/log/nginx/access.log ltsv;
    access_log /var/log/nginx/motolotz_access.json.log motolotz_json;

    ssl_certificate /etc/letsencrypt/live/motolotz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motolotz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://motolotz.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name motolotz.com;
    access_log /var/log/nginx/access.log ltsv;
    access_log /var/log/nginx/motolotz_access.json.log motolotz_json;

    ssl_certificate /etc/letsencrypt/live/motolotz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motolotz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $request_id always;
    }

    location ~ /\. {
        deny all;
    }
}
