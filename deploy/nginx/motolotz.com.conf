# Included from the Nginx http context (for example, sites-enabled).
# Keep request paths free of query strings, which may contain credentials.
log_format motolotz_json escape=json
    '{"time":"$time_iso8601",'
    '"country":"$http_cf_ipcountry",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"protocol":"$server_protocol",'
    '"status":"$status",'
    '"request_time":"$request_time"}';

server {
    listen 80;
    listen [::]:80;
    server_name motolotz.com www.motolotz.com;
    access_log /var/log/nginx/access.log motolotz_json;
    return 301 https://motolotz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.motolotz.com;
    access_log /var/log/nginx/access.log motolotz_json;
    return 301 https://motolotz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name motolotz.com;
    access_log /var/log/nginx/access.log motolotz_json;

    ssl_certificate /etc/letsencrypt/live/motolotz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motolotz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }
}
