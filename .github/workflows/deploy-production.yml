name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    name: Build production image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE_NAME: ghcr.io/ariki41/bikeparking
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  deploy-production:
    name: Deploy production server
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    concurrency: { group: deployment-production, cancel-in-progress: false }
    permissions: { contents: read }
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_PATH: /opt/motolotz
      IMAGE_NAME: ghcr.io/ariki41/bikeparking
      IMAGE_DIGEST: ${{ needs.image.outputs.image_digest }}
      PRODUCTION_APP_KEY: ${{ secrets.PRODUCTION_APP_KEY }}
      PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      PRODUCTION_MYSQL_ROOT_PASSWORD: ${{ secrets.PRODUCTION_MYSQL_ROOT_PASSWORD }}
      PRODUCTION_YOLP_CLIENT_ID: ${{ secrets.PRODUCTION_YOLP_CLIENT_ID }}
      PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL || 'https://motolotz.com' }}
      PRODUCTION_DB_DATABASE: ${{ vars.PRODUCTION_DB_DATABASE || 'motolotz' }}
      PRODUCTION_DB_USERNAME: ${{ vars.PRODUCTION_DB_USERNAME || 'motolotz' }}
      PRODUCTION_YOLP_URL: ${{ vars.PRODUCTION_YOLP_URL }}
      PRODUCTION_YOLP_GEOCODE_URL: ${{ vars.PRODUCTION_YOLP_GEOCODE_URL }}
      PRODUCTION_JAPAN_POST_POSTAL_CODE_URL: ${{ vars.PRODUCTION_JAPAN_POST_POSTAL_CODE_URL }}
      PRODUCTION_LOKI_URL: ${{ vars.PRODUCTION_LOKI_URL }}
      PRODUCTION_QUERY_LOG_SLOW_MS: ${{ vars.PRODUCTION_QUERY_LOG_SLOW_MS || '500' }}
      PRODUCTION_QUERY_LOG_SAMPLE_RATE: ${{ vars.PRODUCTION_QUERY_LOG_SAMPLE_RATE || '0.1' }}
      PRODUCTION_QUERY_LOG_MAX_PER_PROCESS: ${{ vars.PRODUCTION_QUERY_LOG_MAX_PER_PROCESS || '10' }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Validate production server
        run: |
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "sh -s -- '$DEPLOY_PATH'" <<'REMOTE'
          set -eu
          test -d "$1" && test -w "$1"
          docker info >/dev/null
          docker compose version >/dev/null
          sudo -n nginx -t >/dev/null
          REMOTE
      - name: Upload and activate image
        run: |
          for required_value in PRODUCTION_APP_KEY PRODUCTION_DB_PASSWORD PRODUCTION_MYSQL_ROOT_PASSWORD PRODUCTION_YOLP_URL PRODUCTION_YOLP_GEOCODE_URL PRODUCTION_JAPAN_POST_POSTAL_CODE_URL PRODUCTION_LOKI_URL; do
            if [ -z "${!required_value}" ]; then
              echo "The Production environment value ${required_value} is required." >&2
              exit 1
            fi
          done

          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          umask 077
          write_dotenv() {
            local key="$1" value="$2"

            case "$value" in
              *$'\n'*|*$'\r'*)
                echo "${key} must not contain a line break." >&2
                exit 1
                ;;
            esac

            value="$(printf '%s' "$value" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' -e 's/\$/\\$/g')"
            printf '%s="%s"\n' "$key" "$value"
          }

          {
            write_dotenv APP_NAME 'MotoLotz'
            write_dotenv APP_ENV 'production'
            write_dotenv APP_KEY "$PRODUCTION_APP_KEY"
            write_dotenv APP_DEBUG 'false'
            write_dotenv APP_URL "$PRODUCTION_APP_URL"
            write_dotenv APP_TIMEZONE 'Asia/Tokyo'
            write_dotenv LOG_CHANNEL 'stack'
            write_dotenv LOG_STACK 'daily'
            write_dotenv LOG_LEVEL 'warning'
            write_dotenv LOG_DAILY_DAYS '14'
            write_dotenv LOG_QUERY_DAILY_DAYS '14'
            write_dotenv QUERY_LOG_ENABLED 'true'
            write_dotenv QUERY_LOG_SLOW_MS "$PRODUCTION_QUERY_LOG_SLOW_MS"
            write_dotenv QUERY_LOG_SAMPLE_RATE "$PRODUCTION_QUERY_LOG_SAMPLE_RATE"
            write_dotenv QUERY_LOG_MAX_PER_PROCESS "$PRODUCTION_QUERY_LOG_MAX_PER_PROCESS"
            write_dotenv APP_LOCALE 'ja'
            write_dotenv APP_FALLBACK_LOCALE 'ja'
            write_dotenv DB_CONNECTION 'mysql'
            write_dotenv DB_HOST 'mysql'
            write_dotenv LOKI_URL "$PRODUCTION_LOKI_URL"
            write_dotenv DB_PORT '3306'
            write_dotenv DB_DATABASE "$PRODUCTION_DB_DATABASE"
            write_dotenv DB_USERNAME "$PRODUCTION_DB_USERNAME"
            write_dotenv DB_PASSWORD "$PRODUCTION_DB_PASSWORD"
            write_dotenv MYSQL_ROOT_PASSWORD "$PRODUCTION_MYSQL_ROOT_PASSWORD"
            write_dotenv SESSION_DRIVER 'database'
            write_dotenv CACHE_STORE 'database'
            write_dotenv QUEUE_CONNECTION 'database'
            write_dotenv FILESYSTEM_DISK 'public'
            write_dotenv YOLP_URL "$PRODUCTION_YOLP_URL"
            write_dotenv YOLP_GEOCODE_URL "$PRODUCTION_YOLP_GEOCODE_URL"
            write_dotenv YOLP_CLIENT_ID "$PRODUCTION_YOLP_CLIENT_ID"
            write_dotenv JAPAN_POST_POSTAL_CODE_URL "$PRODUCTION_JAPAN_POST_POSTAL_CODE_URL"
          } > "$env_file"

          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$env_file" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 600 '$DEPLOY_PATH/.env'"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/deploy/alloy' '$DEPLOY_PATH/deploy/nginx'"
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes compose.deploy.yml scripts/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/alloy/config.alloy \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/alloy/config.alloy"
          scp -P "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes deploy/nginx/motolotz.com.conf \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/nginx/motolotz.com.conf"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "env IMAGE_NAME='$IMAGE_NAME' IMAGE_DIGEST='$IMAGE_DIGEST' bash '$DEPLOY_PATH/deploy.sh' '$DEPLOY_PATH'"
